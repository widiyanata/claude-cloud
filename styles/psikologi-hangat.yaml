identity:
  name: "Psikologi Hangat"
  category: motion-graphics
  mood: calm, warm, empathetic, curious
  pace: moderate
  best_for: "Channel psikologi berbahasa Indonesia: explainer panjang YouTube dan Shorts/Reels"

visual_language:
  color_palette:
    primary: ["#2F4858", "#33658A"]
    accent: ["#F6AE2D", "#F26419"]
    background: "#FBF6EE"
    text: "#1F2A33"
    muted: "#86939E"
  composition: generous whitespace, one idea per frame, subject slightly off-center, metaphor objects over literal people
  texture: flat illustration on warm paper, soft grain, rounded shapes, no photoreal faces

typography:
  headings:
    font: "Plus Jakarta Sans"
    weight: 800
    tracking: "-0.02em"
  body:
    font: "Plus Jakarta Sans"
    weight: 500
    line_height: 1.45
  stat_card:
    font: "Plus Jakarta Sans"
    weight: 800
    size_multiplier: 3.5
  scale_system: "major_third"
  weight_matrix:
    title: 800
    heading: 700
    body: 500
    caption: 500

motion:
  transitions: [push-left, zoom-in, morph, cut]
  animation_style: "spring(1, 100, 14), soft, low overshoot"
  pacing_rules:
    min_scene_hold_seconds: 2.0
    max_scene_hold_seconds: 7
    text_card_hold_seconds: 3.0
    stat_card_hold_seconds: 2.5
    transition_duration_seconds: 0.4
  entrance: "fade-up with slight scale (0.96 -> 1.0)"
  exit: "fade-down"

audio:
  voice_style: "tenang, hangat, seperti teman yang paham psikologi; tempo sedang"
  music_mood: "lo-fi piano, ambient, reflective, no vocals"
  music_volume: 0.10
  sfx_style: "soft pops, paper swipes, gentle chimes; never harsh"
  ducking_threshold_db: -4

asset_generation:
  image_prompt_prefix: "flat editorial illustration, warm paper background, muted navy and warm yellow palette, simple rounded shapes, symbolic metaphor, "
  image_negative_prompt: "photorealistic faces, gore, self-harm imagery, clinical hospital scenes, brain scans with fake detail, text, watermark"
  diagram_style: "navy strokes on warm paper, rounded boxes, yellow highlights for the key idea"
  consistency_anchors:
    - "Warm paper (#FBF6EE) background in every scene"
    - "Navy (#2F4858) for structure, yellow (#F6AE2D) only for the one key idea"
    - "Symbolic objects (kompas, awan, tali, lampu) instead of realistic people"
    - "Same recurring mascot/character when one is used"

overlays:
  stat_card:
    bg: "#FFFFFF"
    border: "#33658A"
    radius: 16
    shadow: "0 8px 24px rgba(47,72,88,0.12)"
  key_term:
    bg: "#FDE7B8"
    text: "#2F4858"
    radius: 8

quality_rules:
  - "Minimum contrast ratio 4.5:1 for all text"
  - "Maximum 4 colors on screen (paper background counts as one)"
  - "Every claim on screen that cites research shows a short source tag (Penulis, Tahun)"
  - "Every scene has at least one animated element"
  - "No imagery that depicts self-harm, suicide methods, or graphic distress"

chart_palette:
  - "#33658A"
  - "#F6AE2D"
  - "#F26419"
  - "#2F4858"
  - "#86BBD8"
  - "#758E4F"

color_rules:
  harmony_type: "complementary"
  contrast_validation: true
  colorblind_safe: true
